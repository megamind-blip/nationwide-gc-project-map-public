<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="description" content="Explore completed Nationwide General Contracting projects across the United States." />
<title>Completed Projects Across the United States | Nationwide GC</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root{
  --navy:#0b1930;--navy-deep:#06101f;--navy-ink:#14243f;--cream:#f7f5ee;--paper:#fff;
  --line:#e5e1d7;--ink:#17233a;--muted:#687386;--gold:#fab400;--panel-w:440px;
  --roofing:#0b1930;--siding:#b57818;--gutters:#23766f;--solar:#d66723;--other:#687386;--multi:#805b24;
}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Khula,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}
#project-map-app{display:flex;width:100%;height:100vh;min-height:660px;overflow:hidden;background:var(--cream)}
#project-map{flex:1;height:100%;z-index:1;background:#e7ebee}
#project-panel{width:var(--panel-w);height:100%;display:flex;flex-direction:column;background:var(--paper);border-left:1px solid var(--line);box-shadow:-10px 0 32px rgba(11,25,48,.08);z-index:3}
.map-header{padding:21px 22px 18px;color:#fff;background:linear-gradient(145deg,var(--navy) 0%,var(--navy-deep) 100%);border-bottom:4px solid var(--gold)}
.map-brand{display:flex;align-items:center;gap:13px}.map-brand img{width:176px;max-height:52px;object-fit:contain;object-position:left center}.map-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--gold);font-weight:800}.map-title{margin:5px 0 0;font-size:21px;line-height:1.15;font-weight:800}.map-copy{margin-top:9px;font-size:12.5px;line-height:1.4;color:rgba(255,255,255,.78)}
.map-stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--navy-ink);color:#fff}.map-stat{text-align:center;padding:11px 5px;border-right:1px solid rgba(255,255,255,.12)}.map-stat:last-child{border:0}.map-stat b{display:block;font-size:19px;line-height:1;font-weight:800}.map-stat span{display:block;margin-top:4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.68}
.map-tools{padding:13px 15px 12px;background:var(--cream);border-bottom:1px solid var(--line)}.map-search{display:flex;gap:7px}.map-search input{min-width:0;flex:1;padding:10px 11px;border:1px solid #d9d6ce;border-radius:8px;background:#fff;color:var(--ink);outline:0;font-size:13.5px}.map-search input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,25,48,.1)}.map-search button{padding:0 14px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer}.map-search button:hover{background:var(--navy-deep)}
.search-hint{margin-top:6px;min-height:17px;color:var(--muted);font-size:11px}.filter-row{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}.filter-chip{white-space:nowrap;padding:7px 10px;border:1px solid #dad6cd;border-radius:999px;background:#fff;color:var(--navy-ink);font-size:11px;font-weight:800;cursor:pointer}.filter-chip:hover{border-color:var(--navy)}.filter-chip.active{border-color:var(--navy);background:var(--navy);color:#fff}.filter-chip[data-filter="multi"].active{border-color:var(--multi);background:var(--multi)}
.map-list{flex:1;overflow:auto;overscroll-behavior:contain;background:#fff}.list-heading{position:sticky;top:0;z-index:2;padding:8px 15px;background:rgba(247,244,236,.97);border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.project-card{padding:12px 15px;border-bottom:1px solid #efede7;cursor:pointer}.project-card:hover,.project-card:focus{background:#f9fafc;outline:0}.project-address{font-size:13.5px;font-weight:800;color:var(--navy-ink);line-height:1.25}.project-city{margin-top:2px;font-size:11.5px;color:var(--muted)}.build-count{margin-top:5px;color:var(--muted);font-size:10.5px;font-weight:700}.category-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.category-badge{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;color:#fff;font-size:9px;line-height:1;text-transform:uppercase;letter-spacing:.06em;font-weight:900}.category-badge.roofing{background:var(--roofing)}.category-badge.siding{background:var(--siding)}.category-badge.gutters{background:var(--gutters)}.category-badge.solar{background:var(--solar)}.category-badge.other{background:var(--other)}
.map-cta{padding:11px 15px;background:var(--cream);border-top:1px solid var(--line)}.map-cta a{display:block;padding:11px;border-radius:8px;background:var(--gold);color:#332600;text-align:center;text-decoration:none;font-size:13px;font-weight:900;letter-spacing:.02em}.map-cta a:hover{filter:brightness(1.04)}
.loading{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--navy);font-weight:800}.spinner{width:23px;height:23px;margin-right:11px;border:3px solid #d8d4cb;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pmi-cluster{background:transparent}.pmi-cluster div{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border:3px solid rgba(255,255,255,.9);border-radius:50%;background:var(--navy);box-shadow:0 3px 11px rgba(11,25,48,.32);color:#fff;font-size:12px;font-weight:900}.project-pin{width:20px;height:20px;transform:rotate(-45deg);border:2px solid #fff;border-radius:50% 50% 50% 0;box-shadow:0 2px 7px rgba(0,0,0,.35)}.project-pin.roofing{background:var(--roofing)}.project-pin.siding{background:var(--siding)}.project-pin.gutters{background:var(--gutters)}.project-pin.solar{background:var(--solar)}.project-pin.other{background:var(--other)}.project-pin.multi{background:var(--multi);box-shadow:0 0 0 3px rgba(250,180,0,.55),0 3px 8px rgba(0,0,0,.36)}
.popup-opening .leaflet-popup{visibility:hidden}.leaflet-popup-content-wrapper{padding:0;border-radius:12px;box-shadow:0 12px 34px rgba(11,25,48,.25);overflow:hidden}.leaflet-popup-content{width:320px!important;margin:0;line-height:1.35;font:inherit}.leaflet-container a.leaflet-popup-close-button{width:32px;height:32px;padding:0;top:4px;right:6px;text-align:center;color:#fff;z-index:3;font:20px/32px Tahoma,Verdana,sans-serif}.leaflet-container a.leaflet-popup-close-button:hover,.leaflet-container a.leaflet-popup-close-button:focus{color:rgba(255,255,255,.88);outline:0}.leaflet-container a.leaflet-popup-close-button:focus-visible{color:#fff;outline:2px solid var(--gold);outline-offset:2px}.popup-head{padding:14px 44px 12px 16px;background:linear-gradient(145deg,var(--navy),var(--navy-deep));color:#fff}.popup-address{font-size:15px;line-height:1.25;font-weight:900}.popup-city{margin-top:2px;color:rgba(255,255,255,.72);font-size:11.5px}.popup-builds{max-height:430px;overflow-y:auto;padding:4px 16px 12px;background:#fff}.build-section{padding:12px 0;border-bottom:1px solid #ece9e2}.build-section:last-child{border-bottom:0}.build-kicker{margin-bottom:3px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.build-title{display:flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--navy-deep);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:900}.build-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%}.build-dot.roofing{background:var(--roofing)}.build-dot.siding{background:var(--siding)}.build-dot.gutters{background:var(--gutters)}.build-dot.solar{background:var(--solar)}.build-dot.other{background:var(--other)}.material-grid{display:grid;grid-template-columns:118px 1fr;gap:4px 10px;font-size:11.5px;line-height:1.35}.material-label{color:var(--muted)}.material-value{color:var(--ink);font-weight:700;overflow-wrap:anywhere}.material-value.missing{color:var(--muted);font-weight:500;font-style:italic}.leaflet-control-zoom a{color:var(--navy-deep)!important}
@media(max-width:820px){#project-map-app{min-height:720px;flex-direction:column}#project-map{height:46vh;min-height:330px;order:1}#project-panel{width:100%;height:54vh;min-height:390px;order:2;border-left:0;border-top:1px solid var(--line)}.map-header{padding:12px 14px 10px}.map-brand img{width:132px;max-height:38px}.map-title{font-size:16px}.map-copy{display:none}.map-stats .map-stat{padding:8px 4px}.map-stat b{font-size:16px}.map-tools{padding:9px 11px 8px}.filter-row{margin-top:7px}.leaflet-popup-content{width:min(305px,calc(100vw - 72px))!important}.popup-head{padding:12px 44px 12px 16px}.popup-address{font-size:14.5px}.popup-builds{max-height:clamp(160px,calc(46vh - 140px),270px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin}.build-section{padding:10px 0}.build-title{margin-bottom:6px;font-size:10.5px}.material-grid{display:block;font-size:12.5px;line-height:1.4}.material-label{margin:8px 0 0;font-size:10px;font-weight:700}.material-grid>.material-label:first-child{margin-top:0}.material-value{margin-top:1px}}
@media(max-width:420px){#project-map-app{min-height:680px}.map-header{display:none}#project-map{height:48vh;min-height:300px}#project-panel{height:52vh}.project-card{padding:10px 13px}.map-cta{padding:8px 11px}.popup-builds{max-height:clamp(150px,calc(48vh - 140px),260px)}}
</style>
</head>
<body>
<div id="project-map-app">
  <main id="project-map" aria-label="Map of completed Nationwide projects across the United States"></main>
  <aside id="project-panel" aria-label="Completed project directory">
    <header class="map-header">
      <div class="map-brand"><img src="./assets/nationwide-logo.webp" alt="Nationwide General Contracting" /><div><div class="map-eyebrow">Nationwide GC</div><h1 class="map-title">Completed Projects Nationwide</h1></div></div>
      <div class="map-copy">Explore every completed, geocoded Build in Salesforce. Each property appears once and includes all completed work at that address.</div>
    </header>
    <section class="map-stats" id="map-stats" aria-label="Project statistics"></section>
    <section class="map-tools">
      <div class="map-search"><input id="map-query" type="search" autocomplete="street-address" placeholder="Enter an address, city, or state…" aria-label="Search by address, city, or state" /><button id="map-search-button" type="button">Search</button></div>
      <div class="search-hint" id="search-hint">Find completed Nationwide projects near you.</div>
      <div class="filter-row" role="group" aria-label="Filter projects by work category">
        <button class="filter-chip active" type="button" data-filter="all">All</button>
        <button class="filter-chip" type="button" data-filter="roofing">Roofing</button>
        <button class="filter-chip" type="button" data-filter="siding">Siding</button>
        <button class="filter-chip" type="button" data-filter="gutters">Gutters</button>
        <button class="filter-chip" type="button" data-filter="other">Other</button>
        <button class="filter-chip" type="button" data-filter="multi">Multiple Trades</button>
      </div>
    </section>
    <section class="map-list" id="map-list" aria-live="polite"></section>
    <footer class="map-cta"><a id="estimate-link" href="https://www.nationwidegc.com/contact-us" target="_top">Get a Free Inspection</a></footer>
  </aside>
  <div class="loading" id="loading"><span class="spinner"></span>Loading completed projects…</div>
</div>
<script>
(function(){
  "use strict";
  var CONFIG={dataBase:"./data/",tileUrl:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",tileAttr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'};
  var PROJECTS=[],FILTERED=[],STATS={},map,cluster,markerById={},activeFilter="all";
  function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function categories(p){return Array.from(new Set(p.builds.map(function(b){return b.category;})));}
  function pinType(p){var kinds=categories(p);return kinds.length>1?"multi":kinds[0].toLowerCase();}
  function matchesFilter(p){var kinds=categories(p).map(function(kind){return kind.toLowerCase();});if(activeFilter==="multi")return kinds.length>1;if(activeFilter==="other")return kinds.indexOf("other")>-1||kinds.indexOf("solar")>-1;if(activeFilter==="all")return true;return kinds.indexOf(activeFilter)>-1;}
  function projectIcon(kind){return L.divIcon({className:"",html:'<div class="project-pin '+kind+'"></div>',iconSize:[20,20],iconAnchor:[10,20],popupAnchor:[0,-17]});}
  function materialRow(label,value){var missing=value==="Not recorded";return '<div class="material-label">'+esc(label)+'</div><div class="material-value'+(missing?' missing':'')+'">'+esc(value)+'</div>';}
  function buildSection(build,index){var kind=build.category.toLowerCase();return '<section class="build-section"><div class="build-kicker">Completed Build '+(index+1)+'</div><div class="build-title"><span class="build-dot '+kind+'"></span>'+esc(build.type)+'</div><div class="material-grid">'+materialRow("Material Manufacturer",build.manufacturer)+materialRow("Material Product Line",build.productLine)+materialRow("Material Color",build.color)+materialRow("Year Completed",build.yearInstalled)+'</div></section>';}
  function popupHtml(p){var city=[p.c,p.st].filter(Boolean).join(", ");return '<article><header class="popup-head"><div class="popup-address">'+esc(p.s||city)+'</div>'+(p.s?'<div class="popup-city">'+esc(city)+'</div>':'')+'</header><div class="popup-builds">'+p.builds.map(buildSection).join("")+'</div></article>';}
  function initMap(){map=L.map("project-map",{zoomControl:true,scrollWheelZoom:true,attributionControl:true}).setView([37.8,-96.0],4);L.tileLayer(CONFIG.tileUrl,{attribution:CONFIG.tileAttr,subdomains:"abcd",maxZoom:19}).addTo(map);cluster=L.markerClusterGroup({maxClusterRadius:48,showCoverageOnHover:false,spiderfyOnMaxZoom:true,iconCreateFunction:function(c){var n=c.getChildCount(),size=n<10?34:n<100?42:n<500?50:58;return L.divIcon({html:"<div>"+n+"</div>",className:"pmi-cluster",iconSize:[size,size]});}});map.addLayer(cluster);}
  function drawProjects(){cluster.clearLayers();markerById={};var bounds=[];FILTERED.forEach(function(p){var marker=L.marker([p.lat,p.lng],{icon:projectIcon(pinType(p)),title:(p.s||p.c)+" — "+p.builds.length+" completed build"+(p.builds.length===1?"":"s")});marker.bindPopup(popupHtml(p),{maxWidth:340});markerById[p.id]=marker;cluster.addLayer(marker);bounds.push([p.lat,p.lng]);});if(bounds.length&&FILTERED.length!==PROJECTS.length)map.fitBounds(bounds,{padding:[36,36],maxZoom:12});}
  function renderStats(){document.getElementById("map-stats").innerHTML='<div class="map-stat"><b>'+Number(STATS.totalBuilds||0).toLocaleString()+'</b><span>Completed Builds</span></div><div class="map-stat"><b>'+Number(STATS.totalProperties||0).toLocaleString()+'</b><span>Properties</span></div><div class="map-stat"><b>'+Number(STATS.stateCount||0).toLocaleString()+'</b><span>States</span></div>';}
  function badges(p){return categories(p).map(function(kind){return '<span class="category-badge '+kind.toLowerCase()+'">'+esc(kind)+'</span>';}).join("");}
  function revealPopupWhenReady(marker){var el=map.getContainer(),tries=0;function reveal(){var popup=marker.getPopup().getElement(),mapTop=el.getBoundingClientRect().top;if(!popup||(popup.getBoundingClientRect().top<mapTop&&tries++<90)){requestAnimationFrame(reveal);return;}el.classList.remove("popup-opening");}reveal();}
  function openProjectPopup(p,marker){var el=map.getContainer();el.classList.add("popup-opening");function show(){var z=16,point=map.project([p.lat,p.lng],z),offset=map.getSize().y<500?130:0;map.stop();map.setView(map.unproject(point.subtract([0,offset]),z),z,{animate:false});requestAnimationFrame(function(){marker.openPopup();revealPopupWhenReady(marker);});}if(map.hasLayer(marker))show();else cluster.zoomToShowLayer(marker,show);}
  function renderProjects(){var list=document.getElementById("map-list"),limit=500,shown=FILTERED.slice(0,limit),html='<div class="list-heading">'+FILTERED.length.toLocaleString()+' properties · one pin per address</div>';shown.forEach(function(p){var city=[p.c,p.st].filter(Boolean).join(", ");html+='<article class="project-card" tabindex="0" role="button" data-id="'+esc(p.id)+'"><div class="project-address">'+esc(p.s||city)+'</div>'+(p.s?'<div class="project-city">'+esc(city)+'</div>':'')+'<div class="build-count">'+p.builds.length+' completed build'+(p.builds.length===1?'':'s')+'</div><div class="category-badges">'+badges(p)+'</div></article>';});if(FILTERED.length>limit)html+='<div class="list-heading" style="text-align:center">Showing the first '+limit.toLocaleString()+' — use filters or search to narrow results</div>';list.innerHTML=html;list.querySelectorAll(".project-card").forEach(function(card){function open(){var id=card.getAttribute("data-id"),p=PROJECTS.find(function(item){return item.id===id;}),marker=markerById[id];if(p&&marker)openProjectPopup(p,marker);}card.addEventListener("click",open);card.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});});}
  function applyFilter(value){activeFilter=value;FILTERED=PROJECTS.filter(matchesFilter);document.querySelectorAll(".filter-chip").forEach(function(chip){chip.classList.toggle("active",chip.getAttribute("data-filter")===value);});drawProjects();renderProjects();document.getElementById("search-hint").textContent=FILTERED.length.toLocaleString()+" matching properties.";}
  function distance(la1,lo1,la2,lo2){var R=3959,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180,a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
  function search(){var query=document.getElementById("map-query").value.trim(),hint=document.getElementById("search-hint");if(!query)return;hint.textContent="Searching…";var local=PROJECTS.filter(function(p){return [p.s,p.c,p.st].join(" ").toLowerCase().indexOf(query.toLowerCase())>-1&&matchesFilter(p);});if(local.length){FILTERED=local;drawProjects();renderProjects();map.fitBounds(local.map(function(p){return[p.lat,p.lng];}),{padding:[35,35],maxZoom:13});hint.textContent=local.length.toLocaleString()+" matching properties.";return;}fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+encodeURIComponent(query),{headers:{Accept:"application/json"}}).then(function(r){return r.json();}).then(function(results){if(!results.length){hint.textContent="Location not found — try city and state.";return;}var lat=+results[0].lat,lng=+results[0].lon,near=PROJECTS.filter(function(p){return matchesFilter(p)&&distance(lat,lng,p.lat,p.lng)<=5;});FILTERED=near;drawProjects();renderProjects();map.setView([lat,lng],12,{animate:true});L.circleMarker([lat,lng],{radius:8,color:"#fab400",weight:3,fillColor:"#fff",fillOpacity:1}).addTo(map).bindTooltip("Your location");hint.textContent=near.length.toLocaleString()+" matching properties within approximately 5 miles.";}).catch(function(){hint.textContent="Search is temporarily unavailable.";});}
  function validateData(projects){var ids={},addresses={};projects.forEach(function(p){if(ids[p.id])throw new Error("Duplicate public project ID: "+p.id);ids[p.id]=1;var street=String(p.s==null?"":p.s).trim();if(street){var key=[p.s,p.c,p.st].join("|").toUpperCase().replace(/[^A-Z0-9|]/g,"");if(addresses[key])throw new Error("Duplicate public address key");addresses[key]=1;}if(!Array.isArray(p.builds)||!p.builds.length)throw new Error("Project missing builds");p.builds.forEach(function(b){["type","category","manufacturer","productLine","color","yearInstalled"].forEach(function(field){if(b[field]===undefined||b[field]===null||b[field]==="")throw new Error("Build missing "+field);});});});}
  function wire(){document.getElementById("map-search-button").addEventListener("click",search);document.getElementById("map-query").addEventListener("keydown",function(e){if(e.key==="Enter")search();});document.querySelectorAll(".filter-chip").forEach(function(chip){chip.addEventListener("click",function(){applyFilter(chip.getAttribute("data-filter"));});});}
  function boot(){initMap();Promise.all([fetch(CONFIG.dataBase+"projects.json").then(function(r){if(!r.ok)throw new Error("projects.json "+r.status);return r.json();}),fetch(CONFIG.dataBase+"stats.json").then(function(r){if(!r.ok)throw new Error("stats.json "+r.status);return r.json();})]).then(function(data){PROJECTS=data[0];STATS=data[1];validateData(PROJECTS);FILTERED=PROJECTS.slice();renderStats();drawProjects();renderProjects();wire();var bounds=PROJECTS.map(function(p){return[p.lat,p.lng];});if(bounds.length)map.fitBounds(bounds,{padding:[35,35]});document.getElementById("loading").style.display="none";}).catch(function(error){document.getElementById("loading").innerHTML="Project map data could not be loaded.";console.error(error);});}
  if(document.readyState!=="loading")boot();else document.addEventListener("DOMContentLoaded",boot);
})();
</script>
</body>
</html>
